upstream careerpulse_backend {
    # Keep this in sync with the backend upstream in careerpulse.conf.
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com;

    # Replace app.example.com after issuing the certificate for the real domain.
    ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # M3 business API and the future resume upload both stay under 10 MiB.
    client_max_body_size 10m;

    root /opt/careerpulse/app/front/dist;
    index index.html;

    # Browser business API + auth. This block must be declared before the SPA
    # fallback so /api/* never falls through to index.html.
    location /api/ {
        proxy_pass http://careerpulse_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Session/CSRF cookies are HttpOnly and SameSite=Lax: they are forwarded
        # unchanged because the SPA and the API share this origin. Never add
        # proxy_cookie_* rewriting here, and never strip the X-CSRF-Token header.
        proxy_read_timeout 60s;
    }

    # Optional: expose the health endpoint on the browser origin for monitoring.
    location = /healthz {
        proxy_pass http://careerpulse_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # Static assets are content-hashed by Vite and may be cached aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every remaining route is handled by the Vue router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
